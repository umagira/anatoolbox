name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # The package claims Python >= 3.10; this is what checks that claim.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check anatoolbox tests
      - run: ruff format --check anatoolbox tests
      - run: pytest -q
